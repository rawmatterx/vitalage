# Render "Blueprint": tells render.com how to build and run the VitalAge app.
# In Render: New > Blueprint > pick this repository. See app/README.md.
services:
  - type: web
    name: vitalage
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r app/requirements.txt &&
      python app/manage.py collectstatic --noinput &&
      python app/manage.py migrate --noinput
    startCommand: gunicorn --chdir app vitalage_site.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Encrypts emails and birth dates. Render makes it once and keeps it.
      # Never change or delete it: data encrypted with it could not be read again.
      - key: VITALAGE_FIELD_KEY
        generateValue: true
      # Email sending. A GUESS: Brevo's free plan (300 emails a day).
      # Fill these in the Render dashboard; until then emails only go to the logs.
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vitalage-db
          property: connectionString

databases:
  - name: vitalage-db
    plan: free
